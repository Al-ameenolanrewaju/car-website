name: Test car marketplace
on:
  push:
    branches: [main, redesign/clothing-reference]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          SECRET_KEY: test-only-ci-secret
          COOKIE_SECURE: "false"
      - run: node --check static/script.js
